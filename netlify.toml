# `npm run build` type-checks before building, so a type error stops the deploy instead of shipping.
[build]
  command = "npm run build"

# Hashed build assets never change under the same name, so browsers can keep them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline security headers. The site has no forms, logins or third-party scripts,
# so these lock down what it doesn't use without breaking anything it does.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
