# Monthly check that every link on the site still works. Third-party sites change without notice,
# so this runs on a schedule rather than on push, and opens an issue instead of failing a build.
name: Link check

on:
  schedule:
    - cron: '0 14 1 * *' # 1st of each month, 14:00 UTC (morning in Chicago)
  workflow_dispatch: # also runnable from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress 'dist/**/*.html'
          fail: false

      - name: Open an issue listing broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
