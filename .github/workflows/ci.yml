# On every push to main and every pull request: type-check, build, then check accessibility in light and dark.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Type-check, build, accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Serve the build
        run: |
          npm run serve:dist &
          npx --yes wait-on@9 http://localhost:4400

      - name: Accessibility (WCAG 2 AA, light and dark)
        run: npm run test:a11y
